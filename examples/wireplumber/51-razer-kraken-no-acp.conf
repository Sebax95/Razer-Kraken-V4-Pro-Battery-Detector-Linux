# Expose both raw ALSA PCM subdevices (Chat + Game) of the Razer Kraken V4 Pro
# dock instead of letting alsa-card-profile (ACP) collapse them into one
# generic "analog-stereo" profile that only ever binds to the Chat interface.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x1532"
        device.product.id = "0x0568"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
]
