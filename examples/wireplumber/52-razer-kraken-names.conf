# Give the Razer Kraken V4 Pro's two ALSA PCM subdevices proper names --
# without this, PipeWire/ACP labels them "Razer Kraken V4 Pro" (Chat) and
# "Razer Kraken V4 Pro (USB Audio #1)" (Game), which is impossible to tell
# apart in any output picker. See kraken-v4-pro-battery's `kraken output`.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.usb-Razer_Kraken_V4_Pro_-_Chat_Razer_Kraken_V4_Pro-00.playback.0.0"
      }
    ]
    actions = {
      update-props = {
        node.description = "Kraken V4 Pro (Chat)"
        node.nick = "Kraken V4 Pro (Chat)"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.usb-Razer_Kraken_V4_Pro_-_Chat_Razer_Kraken_V4_Pro-00.playback.1.0"
      }
    ]
    actions = {
      update-props = {
        node.description = "Kraken V4 Pro (Game)"
        node.nick = "Kraken V4 Pro (Game)"
      }
    }
  }
]
